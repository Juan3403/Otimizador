name: Release

# Para publicar uma versão nova: git tag v1.2.0 && git push origin v1.2.0
# O workflow compila, gera o instalador, o zip portátil e o SHA256SUMS.txt e cria a Release no GitHub.
# Os computadores que já têm o Otimizador instalado recebem a atualização pelo próprio app.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Gerar pacotes
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          ./tools/build-release.ps1 -Version $version -Repo '${{ github.repository }}'

      - name: Criar Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' (Get-ChildItem dist -File).FullName --title "Otimizador ${{ github.ref_name }}" --generate-notes
